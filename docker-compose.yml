services:
  app:
    build: .
    image: minorskate:latest
    container_name: ${COMPOSE_PROJECT_NAME}-app
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
